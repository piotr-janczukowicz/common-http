name: Release

# Run by hand on the default branch. Deploys the next version to GitHub Packages, tags it and creates the GitHub
# release, then opens the pull request for the next -SNAPSHOT version. The steps live in common-parent
# (reusable-release-package.yml and reusable-next-snapshot.yml); the deploy waits for a green Main run of the same
# commit. If the deploy fails after it uploaded some files, GitHub Packages may refuse the same version again: delete
# that package version, then run the workflow again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      contents: write
      packages: write
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-release-package.yml@fe405361177409155ca46773fdb6b9090ffad722 # v13
    secrets: inherit

  next-snapshot:
    needs: release
    permissions:
      contents: write
      pull-requests: write
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-next-snapshot.yml@fe405361177409155ca46773fdb6b9090ffad722 # v13
    secrets: inherit
    with:
      tag: v${{ needs.release.outputs.release }}
