name: Release

# Run by hand on main. Deploys the next integer version to GitHub Packages, tags it, creates the GitHub release and
# bumps main to the next snapshot. Publishing to Maven Central is a separate workflow that takes the tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
      - name: Resolve release version
        id: version
        run: |
          current=$(mvn -B -s .github/maven-settings.xml -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$current" =~ ^([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::Expected version N-SNAPSHOT with integer N, found '$current'"
            exit 1
          fi
          release=${BASH_REMATCH[1]}
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "next=$((release + 1))-SNAPSHOT" >> "$GITHUB_OUTPUT"
      - name: Fail if tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.release }}"; then
            echo "::error::Tag v${{ steps.version.outputs.release }} already exists"
            exit 1
          fi
      - name: Set release version
        run: mvn -B -s .github/maven-settings.xml versions:set -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false
      - name: Deploy to GitHub Packages
        run: mvn -B -s .github/maven-settings.xml deploy -DdeployAtEnd=false -Prelease
      - name: Tag and create GitHub release
        run: gh release create "v${{ steps.version.outputs.release }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bump to next snapshot
        run: |
          git checkout -- pom.xml
          mvn -B -s .github/maven-settings.xml versions:set -DnewVersion=${{ steps.version.outputs.next }} -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
