name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fail if the parent or an internal dependency is outdated
        run: |
          mvn -B -s .github/maven-settings.xml versions:update-parent versions:update-properties             -Dincludes=pl.piotrjanczukowicz -DgenerateBackupPoms=false
          if ! git diff --exit-code -- pom.xml; then
            echo "::error::pom.xml uses an older common-parent or internal dependency version than the newest released one; apply the diff above"
            exit 1
          fi
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: mvn -B -s .github/maven-settings.xml clean verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
      - name: Resolve common-parent
        run: mvn -B -s .github/maven-settings.xml dependency:get -Dartifact=pl.piotrjanczukowicz:common-parent:1:pom
      - name: Resolve common-build-config
        run: mvn -B -s .github/maven-settings.xml dependency:get -Dartifact=pl.piotrjanczukowicz:common-build-config:1
      - name: Resolve release version
        id: version
        run: |
          current=$(mvn -B -s .github/maven-settings.xml -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$current" =~ ^([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::Expected version N-SNAPSHOT with integer N, found '$current'"
            exit 1
          fi
          release=${BASH_REMATCH[1]}
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "next=$((release + 1))-SNAPSHOT" >> "$GITHUB_OUTPUT"
      - name: Fail if tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.release }}"; then
            echo "::error::Tag v${{ steps.version.outputs.release }} already exists"
            exit 1
          fi
      - name: Deploy release
        run: |
          mvn -B -s .github/maven-settings.xml versions:set -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false
          mvn -B -s .github/maven-settings.xml deploy -DdeployAtEnd=false
      - name: Tag and create GitHub release
        run: gh release create "v${{ steps.version.outputs.release }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bump to next snapshot
        run: |
          git checkout -- pom.xml
          mvn -B -s .github/maven-settings.xml versions:set -DnewVersion=${{ steps.version.outputs.next }} -DgenerateBackupPoms=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Bump version to ${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
