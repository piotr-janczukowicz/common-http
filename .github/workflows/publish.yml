name: Publish to Maven Central

# Run by hand with the tag the Release workflow created (such as v6). The steps live in common-parent so that every
# repository publishes the same way.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v6
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: piotr-janczukowicz/common-parent/.github/workflows/publish.yml@3ebfea92670176284fedb9fb62060a0088f092e8 # v10
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
