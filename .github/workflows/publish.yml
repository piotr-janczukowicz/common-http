name: Publish to Maven Central

# Run by hand with the tag the Release workflow created (such as v6). The steps live in common-parent so that every
# repository publishes the same way.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v6
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: piotr-janczukowicz/common-parent/.github/workflows/publish.yml@ae52ce7b5fb48235e78a3d096b6562edddd8d31f # v11
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
