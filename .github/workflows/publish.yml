name: Publish to Maven Central

# Run by hand with the tag the Release workflow created (such as v6). The steps live in common-parent so that every
# repository publishes the same way.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, such as v6
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: piotr-janczukowicz/common-parent/.github/workflows/reusable-publish.yml@fe405361177409155ca46773fdb6b9090ffad722 # v13
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
