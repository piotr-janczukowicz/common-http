name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fail if the parent or an internal dependency is outdated
        run: |
          mvn -B -s .github/maven-settings.xml versions:update-parent versions:update-properties -Dincludes=io.github.piotr-janczukowicz -DgenerateBackupPoms=false
          if ! git diff --exit-code -- pom.xml; then
            echo "::error::pom.xml uses an older common-parent or internal dependency version than the newest released one; apply the diff above"
            exit 1
          fi
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: mvn -B -s .github/maven-settings.xml clean verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Build the Central bundle without signing
        run: mvn -B -s .github/maven-settings.xml verify -Pcentral -Prelease -Dgpg.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
